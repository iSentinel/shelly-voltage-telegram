name: Apply 0.5.6 candidate

on:
  push:
    branches:
      - candidate/0.5.6-hw

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: candidate/0.5.6-hw
      - name: Apply verified candidate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .candidate-0.5.6.patch.gz.b64 | gzip -dc > /tmp/candidate.patch
          echo 'a29a7901f55017a97822115b42b16feb1f87b9f164f31b00e193e6a53ee888eb  /tmp/candidate.patch' | sha256sum -c -
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          rm -f .candidate-0.5.6.patch.gz.b64
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-quality.py
          python3 -m unittest tests.test_metadata tests.test_workflows tests.test_pro3em_acceptance tests.test_recovery_acceptance -v
      - name: Commit candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 0.5.6-hw software candidate'
          git push origin HEAD:candidate/0.5.6-hw
