name: Apply 0.5.6 candidate patch

on:
  push:
    branches:
      - candidate/0.5.6-hw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: candidate/0.5.6-hw
          fetch-depth: 0

      - name: Decode and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/0.5.6.patch.gz.b64 | gzip -d > /tmp/0.5.6.patch
          echo 'f7bc3d5c48b806d6505cd3746ce3503f76978cb0658b6a44ea56b4cfc5e10b38  /tmp/0.5.6.patch' | sha256sum -c -
          git apply --check /tmp/0.5.6.patch

      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/0.5.6.patch
          rm -f .github/0.5.6.patch.gz.b64

      - name: Validate candidate tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-quality.py
          python -m unittest tests.test_metadata tests.test_workflows tests.test_pro3em_acceptance -v

      - name: Commit candidate files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/apply-0.5.6-candidate.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare 0.5.6-hw software candidate'
          git push origin HEAD:candidate/0.5.6-hw
