name: Apply 0.5.6 recovery acceptance

on:
  push:
    branches:
      - candidate/0.5.6-recovery-acceptance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: candidate/0.5.6-recovery-acceptance
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/0.5.6-recovery.patch.gz.b64 | gzip -d > /tmp/recovery.patch
          echo '04c0fc9bf05710e63fd9596de7739c03d28b0438a8faccf2eb4aa4f0bc89f944  /tmp/recovery.patch' | sha256sum -c -
          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          rm -f .github/0.5.6-recovery.patch.gz.b64

      - name: Validate recovery tooling
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-quality.py
          python -m unittest tests.test_recovery_acceptance tests.test_metadata -v

      - name: Commit recovery tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/apply-0.5.6-recovery.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Add read-only recovery acceptance tooling'
          git push origin HEAD:candidate/0.5.6-recovery-acceptance
