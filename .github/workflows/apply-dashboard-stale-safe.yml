name: Apply dashboard stale-safe hardening

on:
  push:
    branches:
      - hardening/dashboard-stale-safe

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/dashboard-stale-safe
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .dashboard-safe.patch.gz.b64 | gzip -dc > /tmp/dashboard-safe.patch
          echo 'ea60ed22bd2095571b3dfe8ef2c3b9e5d3b450acf95d6a5c5a8f8b3846e6868a  /tmp/dashboard-safe.patch' | sha256sum -c -
          git apply --check /tmp/dashboard-safe.patch
          git apply /tmp/dashboard-safe.patch
          rm -f .dashboard-safe.patch.gz.b64
      - name: Validate project quality
        run: python3 scripts/check-quality.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hide stale voltage from offline dashboard cards'
          git push origin HEAD:hardening/dashboard-stale-safe
