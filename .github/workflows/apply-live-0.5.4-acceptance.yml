name: Apply live 0.5.4 acceptance metadata

on:
  push:
    branches: [live/0.5.4-acceptance]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply live 0.5.4 acceptance metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify and apply acceptance patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/live-0.5.4-acceptance.patch.gz.b64 > /tmp/live.patch.gz
          echo "995e1fd121c928dc85a238c00caea637d9a464a488388224f5a50f4adee77e15  /tmp/live.patch.gz" | sha256sum -c -
          gzip -dc /tmp/live.patch.gz | git apply --check -
          gzip -dc /tmp/live.patch.gz | git apply -
          git diff --check
          python -m unittest tests.test_metadata -q
          python scripts/check-quality.py
          ! grep -RniE 'Development principles|Development quality rules|Правила разработки|Правила розробки|functions ≤ 40 lines' README*.md
          rm -f .github/live-0.5.4-acceptance.patch.gz.b64
          rm -f .github/workflows/apply-live-0.5.4-acceptance.yml
      - name: Commit public acceptance metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record 0.5.4-hw live hardware acceptance'
          git push origin HEAD:live/0.5.4-acceptance
