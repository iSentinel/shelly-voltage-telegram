name: Apply 0.5.6 promotion check

on:
  push:
    branches:
      - feature/0.5.6-promotion-check
    paths:
      - .promotion-check.patch.gz.b64
      - .github/workflows/apply-promotion-check.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/0.5.6-promotion-check
      - name: Verify and apply promotion-check patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .promotion-check.patch.gz.b64 | gzip -d > /tmp/promotion.patch
          echo '79861f4efb8b1be573b834a550ca7fc42aeab53cc6e0db9c7d3c10fe60aaaa43  /tmp/promotion.patch' | sha256sum -c -
          git apply --check /tmp/promotion.patch
          git apply /tmp/promotion.patch
          rm -f .promotion-check.patch.gz.b64
      - name: Commit feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add read-only 0.5.6 promotion checker'
          git push origin HEAD:feature/0.5.6-promotion-check
