name: Apply shared quality gate

on:
  push:
    branches:
      - hardening/shared-quality-gate

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/shared-quality-gate
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .shared-quality-gate.patch.gz.b64 | gzip -dc > /tmp/shared-quality-gate.patch
          echo '88f62683e8da18df306ff5c76c0e6f0432d04cf65fbc9b040146a4a2813d0e19  /tmp/shared-quality-gate.patch' | sha256sum -c -
          git apply --check /tmp/shared-quality-gate.patch
          git apply /tmp/shared-quality-gate.patch
          rm -f .shared-quality-gate.patch.gz.b64
      - name: Validate shared quality gate
        run: |
          python -m pip install ruff==0.14.2
          ./scripts/quality.sh
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use one pinned quality gate locally and in CI'
          git push origin HEAD:hardening/shared-quality-gate
