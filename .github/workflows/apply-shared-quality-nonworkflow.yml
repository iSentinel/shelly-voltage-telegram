name: Apply shared quality gate files

on:
  push:
    branches:
      - hardening/shared-quality-gate

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/shared-quality-gate
      - name: Apply verified non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .shared-quality-nonworkflow.patch.gz.b64 | gzip -dc > /tmp/shared-quality.patch
          echo 'f6d80bbe038c12e015af62c49d62a79504457ab8412f23d484cd2f981bc21531  /tmp/shared-quality.patch' | sha256sum -c -
          git apply --check /tmp/shared-quality.patch
          git apply /tmp/shared-quality.patch
          rm -f .shared-quality-nonworkflow.patch.gz.b64
      - name: Validate shared quality gate
        run: |
          python -m pip install ruff==0.14.2
          ./scripts/quality.sh
      - name: Commit shared gate files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add one pinned local and CI quality gate'
          git push origin HEAD:hardening/shared-quality-gate
