name: Apply verified shared quality files v2

on:
  push:
    branches:
      - hardening/shared-quality-gate-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/shared-quality-gate-v2
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .quality-patch/chunk.* > /tmp/quality.b64
          echo 'e0f08af6b526ff04a73bf88304a1d2163a0f485f3e790729e237fefa8e2b2eb0  /tmp/quality.b64' | sha256sum -c -
          base64 -d /tmp/quality.b64 | gzip -dc > /tmp/quality.patch
          echo 'f6d80bbe038c12e015af62c49d62a79504457ab8412f23d484cd2f981bc21531  /tmp/quality.patch' | sha256sum -c -
          git apply --check /tmp/quality.patch
          git apply /tmp/quality.patch
          rm -rf .quality-patch
      - name: Validate shared quality gate
        run: |
          python -m pip install ruff==0.14.2
          ./scripts/quality.sh
      - name: Commit shared quality files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add one pinned local and CI quality gate'
          git push origin HEAD:hardening/shared-quality-gate-v2
