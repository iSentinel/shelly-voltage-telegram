name: Apply stale-safe metrics hardening

on:
  push:
    branches:
      - hardening/stale-safe-metrics

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/stale-safe-metrics
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .stale-safe.patch.gz.b64 | gzip -dc > /tmp/stale-safe.patch
          echo '72fd8117942d111a39bce5824cec9fbabb9b197e4aa3e6c37b6916ce1ca9dc7c  /tmp/stale-safe.patch' | sha256sum -c -
          git apply --check /tmp/stale-safe.patch
          git apply /tmp/stale-safe.patch
          rm -f .stale-safe.patch.gz.b64
      - name: Validate project quality
        run: python3 scripts/check-quality.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Prometheus voltage metrics stale-safe during outages'
          git push origin HEAD:hardening/stale-safe-metrics
