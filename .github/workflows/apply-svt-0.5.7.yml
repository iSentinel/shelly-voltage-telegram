name: Apply verified 0.5.7-hw patch

on:
  push:
    branches: [fix/telegram-status-pin-ui]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply verified source patch
        env:
          PATCH_B64: 
          IMAGE_BLOB_SHA: e0197c3036902187039362eae2bc37620600a4eb
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/verified.patch
          git apply --check /tmp/verified.patch
          git apply /tmp/verified.patch
          mkdir -p docs
          python - <<'PY'
          import base64, json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{os.environ['IMAGE_BLOB_SHA']}"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          with open("docs/status-message-example.jpg", "wb") as fh:
              fh.write(base64.b64decode(payload["content"]))
          PY
          rm -f .github/workflows/apply-svt-0.5.7.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prepare 0.5.7-hw Telegram status lifecycle"
          git push origin HEAD:fix/telegram-status-pin-ui
