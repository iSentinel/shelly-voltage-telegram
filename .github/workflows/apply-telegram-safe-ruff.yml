name: Apply Telegram stale-safe Ruff fix

on:
  push:
    branches:
      - hardening/telegram-stale-safe

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/telegram-stale-safe
      - name: Apply verified Ruff patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .telegram-safe-ruff.patch.gz.b64 | gzip -dc > /tmp/telegram-safe-ruff.patch
          echo 'b9d020f7c10a6d777df10ec7dd0051344069586b1ed228ca9fd61319a20c94b8  /tmp/telegram-safe-ruff.patch' | sha256sum -c -
          git apply --check /tmp/telegram-safe-ruff.patch
          git apply /tmp/telegram-safe-ruff.patch
          rm -f .telegram-safe-ruff.patch.gz.b64
      - name: Validate exact quality gate
        run: |
          python -m pip install ruff==0.14.2
          ruff format --line-length 79 --check app.py advanced_features.py scripts tests
          ruff check --line-length 79 --select E,F,I,UP,SIM app.py advanced_features.py scripts tests
          python scripts/check-quality.py
      - name: Commit formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format Telegram recovering status with Ruff 0.14.2'
          git push origin HEAD:hardening/telegram-stale-safe
