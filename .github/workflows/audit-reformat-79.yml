name: Audit 79-column formatter

on:
  push:
    branches: ["audit/pep8-maintainability"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit/pep8-maintainability
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Format Python at project line length
        run: ruff format .
      - name: Apply safe lint fixes
        run: ruff check --fix --exit-zero .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "Format Python at 79 columns"
          git push origin HEAD:audit/pep8-maintainability
