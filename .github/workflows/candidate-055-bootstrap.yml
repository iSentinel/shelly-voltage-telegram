name: Apply 0.5.5 signing candidate

on:
  push:
    paths:
      - .github/workflows/candidate-055-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply non-workflow candidate changes
        run: python3 .github/candidate-055.py

      - name: Remove transformation script
        run: rm .github/candidate-055.py

      - name: Validate candidate metadata and workflows
        run: |
          python3 scripts/check-quality.py
          python3 -m unittest tests.test_metadata tests.test_workflows -q

      - name: Commit candidate files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 0.5.5-hw signed image candidate"
          git push origin HEAD:${GITHUB_REF_NAME}
