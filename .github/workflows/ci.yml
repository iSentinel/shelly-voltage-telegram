name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      test_ref:
        required: false
        type: string
    outputs:
      tested_commit:
        description: Exact source commit accepted by CI
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolved.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.test_ref || github.ref }}
          fetch-depth: 0
      - id: resolved
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  test:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install v5 font packages
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          for attempt in 1 2 3; do
            if sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update \
              && sudo apt-get "${apt_options[@]}" install -y \
                --no-install-recommends fonts-inter fonts-noto-core; then
              break
            fi
            if (( attempt == 3 )); then
              echo "ERROR: required v5 fonts unavailable" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for package in fonts-inter fonts-noto-core; do
            dpkg-query -W -f='${Status}\n' "$package" \
              | grep -qx "install ok installed"
          done
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install quality tools
        run: python -m pip install ruff==0.14.2
      - name: Code quality
        run: ./scripts/quality.sh
      - name: Compile Python
        run: python -m compileall -q app.py advanced_features.py apartment_phases.py scripts tests
      - name: Unit tests
        run: |
          set -o pipefail
          python -W default -m unittest discover -s tests -v 2>&1 | tee tests.log
          if grep -q ResourceWarning tests.log; then
            echo "ResourceWarning detected" >&2
            exit 1
          fi
      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-release.sh
          bash -n scripts/configure.sh
          bash -n scripts/bootstrap.sh
          bash -n scripts/backup.sh
          bash -n scripts/support-bundle.sh
          bash -n scripts/rollback.sh
          bash -n scripts/release.sh
          bash -n scripts/quality.sh
          bash -n tests/test_rollback.sh
          bash -n tests/test_release.sh
          bash -n tests/test_install_release.sh
          bash -n tests/test_install_dry_run.sh
          bash -n tests/test_support_bundle.sh
      - name: Installer dry-run fixtures
        run: sudo ./tests/test_install_dry_run.sh
      - name: Rollback fixture
        run: sudo ./tests/test_rollback.sh
      - name: Support-bundle redaction fixture
        run: sudo ./tests/test_support_bundle.sh
      - name: Release archive dry run
        run: ./scripts/release.sh --dry-run
      - name: Reproducible release fixture
        run: ./tests/test_release.sh
      - name: Pinned release installer fixture
        run: sudo ./tests/test_install_release.sh
      - name: Validate Compose syntax
        run: |
          cp .env.example .env
          mkdir -p secrets
          touch secrets/telegram_token secrets/telegram_chat_id secrets/shelly_password
          docker compose config -q
      - name: Validate optional disabled YASNO reader override
        run: |
          docker compose -f compose.yaml -f deploy/compose.yasno-reader.example.yml config -q
      - name: Build container
        run: docker build -t shelly-voltage-telegram:ci .
      - name: Smoke-test real container imports without network
        run: |
          docker run --rm --network none --entrypoint python shelly-voltage-telegram:ci -c "import app; import yasno_cache; import telegram_channel_yasno; print('PASS: container module imports')"
