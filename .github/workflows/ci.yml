name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app.py advanced_features.py scripts tests
      - name: PEP 8 and static checks
        run: ruff check .
      - name: Formatting check
        run: ruff format --check .
      - name: Maintainability checks
        run: python scripts/check_quality.py .
      - name: Unit tests
        run: |
          set -o pipefail
          python -W default -m unittest discover -s tests -v 2>&1 | tee tests.log
          if grep -q ResourceWarning tests.log; then
            echo "ResourceWarning detected" >&2
            exit 1
          fi
      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-release.sh
          bash -n scripts/configure.sh
          bash -n scripts/bootstrap.sh
          bash -n scripts/backup.sh
          bash -n scripts/support-bundle.sh
          bash -n scripts/rollback.sh
          bash -n scripts/release.sh
          bash -n tests/test_rollback.sh
          bash -n tests/test_release.sh
          bash -n tests/test_install_release.sh
          bash -n tests/test_install_dry_run.sh
          bash -n tests/test_support_bundle.sh
      - name: Installer dry-run fixtures
        run: sudo ./tests/test_install_dry_run.sh
      - name: Rollback fixture
        run: sudo ./tests/test_rollback.sh
      - name: Support-bundle redaction fixture
        run: sudo ./tests/test_support_bundle.sh
      - name: Release archive dry run
        run: ./scripts/release.sh --dry-run
      - name: Reproducible release fixture
        run: ./tests/test_release.sh
      - name: Pinned release installer fixture
        run: sudo ./tests/test_install_release.sh
      - name: Validate Compose syntax
        run: |
          cp .env.example .env
          mkdir -p secrets
          touch secrets/telegram_token secrets/telegram_chat_id secrets/shelly_password
          docker compose config -q
      - name: Build container
        run: docker build -t shelly-voltage-telegram:ci .
