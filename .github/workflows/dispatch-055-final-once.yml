name: Dispatch 0.5.5 final release workflows

on:
  push:
    paths:
      - .github/workflows/dispatch-055-final-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact source release and signed image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://api.github.com/repos/${REPOSITORY}/actions/workflows"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail-with-body --silent --show-error \
            -X POST "${headers[@]}" \
            "${base}/release.yml/dispatches" \
            -d '{"ref":"main","inputs":{"tag":"v0.5.5-hw"}}'
          curl --fail-with-body --silent --show-error \
            -X POST "${headers[@]}" \
            "${base}/image.yml/dispatches" \
            -d '{"ref":"main","inputs":{"ref":"v0.5.5-hw","image_tag":"v0.5.5-hw"}}'
