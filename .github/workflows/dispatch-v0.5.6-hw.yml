name: Dispatch v0.5.6-hw release workflows

on:
  push:
    branches:
      - publish/v0.5.6-hw
    paths:
      - .github/workflows/dispatch-v0.5.6-hw.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publish branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: publish/v0.5.6-hw
          fetch-depth: 0

      - name: Dispatch exact release workflows and clean helper
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 5b8674c0eb100e07aed6140b0fa9be92f9758bba
          RELEASE_TAG: v0.5.6-hw
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]] || {
            echo "ERROR: main moved away from expected release SHA" >&2
            exit 2
          }
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$TARGET_SHA" ]] || {
            echo "ERROR: release tag does not point to expected SHA" >&2
            exit 3
          }
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$RELEASE_TAG"
          gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f ref="$RELEASE_TAG" -f image_tag="$RELEASE_TAG"
          rm -f .github/workflows/dispatch-v0.5.6-hw.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove v0.5.6-hw dispatch helper"
          git push origin HEAD:publish/v0.5.6-hw
