name: Sync 0.5.5 acceptance documentation

on:
  push:
    paths:
      - .github/workflows/docs-055-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply documentation acceptance updates
        run: python3 .github/docs-055-sync.py
      - name: Remove temporary sync script
        run: rm .github/docs-055-sync.py
      - name: Validate project metadata and workflow policy
        run: |
          python3 scripts/check-quality.py
          python3 -m unittest tests.test_metadata tests.test_workflows -q
      - name: Commit documentation updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md CHANGELOG.md .github/docs-055-sync.py
          git commit -m "Document 0.5.5 signing acceptance"
          git push origin HEAD:${GITHUB_REF_NAME}
