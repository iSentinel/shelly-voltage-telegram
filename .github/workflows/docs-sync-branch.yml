name: Isolated 0.5.4 metadata sync

on:
  push:
    paths:
      - .github/workflows/docs-sync-branch.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply synchronized metadata
        run: python3 .github/docs-sync.py

      - name: Remove temporary synchronization files
        run: rm .github/docs-sync.py .github/workflows/docs-sync-branch.yml

      - name: Validate final tree
        run: |
          python3 -m unittest tests.test_metadata -q
          python3 scripts/check-quality.py
          ! grep -RqiE 'Development principles|Development quality rules|Правила разработки|Правила розробки' README*.md

      - name: Commit final tree to synchronization branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize 0.5.4 release metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
