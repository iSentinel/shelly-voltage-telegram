name: Fix 0.5.6 changelog count

on:
  push:
    branches:
      - candidate/0.5.6-hw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: candidate/0.5.6-hw
          fetch-depth: 0

      - name: Update accepted test count
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Software acceptance completed with 107\/107 tests/Software acceptance completed with 112\/112 tests/' CHANGELOG.md
          grep -q 'Software acceptance completed with 112/112 tests' CHANGELOG.md
          python scripts/check-quality.py
          python -m unittest tests.test_metadata -v

      - name: Commit corrected changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Align 0.5.6 acceptance test count'
          git push origin HEAD:candidate/0.5.6-hw
