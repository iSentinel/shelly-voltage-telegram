name: Finalize v0.5.3-hw image annotations

on:
  push:
    paths:
      - .github/workflows/image-annotation-finalize-bootstrap.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Dispatch exact release image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run image.yml \
            -f ref=v0.5.3-hw \
            -f image_tag=v0.5.3-hw
      - name: Remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/image-annotation-finalize-bootstrap.yml
          git commit -m 'Remove temporary image annotation dispatcher'
          git push origin HEAD:main
