name: Materialize release branch

on:
  push:
    branches:
      - release/0.5.6-hw
    paths:
      - .github/workflows/materialize-release.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.5.6-hw
          fetch-depth: 0

      - name: Apply validated release patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .release-payload.b64 | gzip --decompress > /tmp/release.patch
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch
          rm -f .release-payload.b64 .github/workflows/materialize-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize 0.5.6-hw release candidate"
          git push origin HEAD:release/0.5.6-hw
