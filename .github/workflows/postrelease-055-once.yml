name: Sync 0.5.5 released metadata

on:
  push:
    paths:
      - .github/workflows/postrelease-055-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out post-release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply released metadata updates
        run: python3 .github/postrelease-055.py
      - name: Remove temporary sync script
        run: rm .github/postrelease-055.py
      - name: Format metadata regression
        run: |
          python -m pip install ruff==0.14.2
          ruff format --line-length 79 tests/test_metadata.py
      - name: Validate metadata and workflow policy
        run: |
          ruff format --line-length 79 --check app.py advanced_features.py scripts tests
          ruff check --line-length 79 --select E,F,I,UP,SIM app.py advanced_features.py scripts tests
          python3 scripts/check-quality.py
          python3 -m unittest tests.test_metadata tests.test_workflows -q
      - name: Commit post-release metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_RU.md README_UA.md RELEASE_STATUS.md ROADMAP.md CHANGELOG.md tests/test_metadata.py .github/postrelease-055.py
          git commit -m "Mark 0.5.5-hw as released"
          git push origin HEAD:${GITHUB_REF_NAME}
