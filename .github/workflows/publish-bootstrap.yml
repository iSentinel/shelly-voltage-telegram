name: Publish validated 0.5.3-hw source

on:
  push:
    paths:
      - .github/workflows/publish-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify validated public source
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/part-* | base64 -d > /tmp/source.tar.gz
          printf '%s  %s\n' \
            'c2826e2d5101cfd1afa23e5a636601077122ffef20a4e82f0aeb9e80a9d6e744' \
            '/tmp/source.tar.gz' | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source --strip-components=1
          test "$(cat /tmp/source/VERSION)" = '0.5.3-hw'
          test ! -e /tmp/source/.env
          test ! -e /tmp/source/secrets
          test ! -e /tmp/source/validation

      - name: Finalize public repository URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('/tmp/source/scripts/bootstrap.sh')
          text = bootstrap.read_text()
          text = text.replace(
              'REPO="${REPO:-OWNER/shelly-voltage-telegram}"',
              'REPO="${REPO:-iSentinel/shelly-voltage-telegram}"',
          )
          text = text.replace(
              'curl -fsSL https://raw.githubusercontent.com/OWNER/REPO/main/scripts/bootstrap.sh | sudo bash',
              'curl -fsSL https://raw.githubusercontent.com/iSentinel/shelly-voltage-telegram/main/scripts/bootstrap.sh | sudo bash',
          )
          text = text.replace(
              'if [[ "$REPO" == OWNER/* ]]; then\n'
              '    echo "ERROR: set REPO=owner/repository until the GitHub URL is finalized." >&2\n'
              '    exit 2\n'
              'fi\n\n',
              '',
          )
          bootstrap.write_text(text)

          readme = Path('/tmp/source/README.md')
          text = readme.read_text()
          text = text.replace('## Future GitHub one-line install', '## GitHub one-line install')
          text = text.replace(
              'A bootstrap script is already included. After the repository URL is finalized, installation becomes:',
              'Install directly from this repository:',
          )
          text = text.replace(
              'curl -fsSL https://raw.githubusercontent.com/OWNER/REPO/main/scripts/bootstrap.sh | sudo bash',
              'curl -fsSL https://raw.githubusercontent.com/iSentinel/shelly-voltage-telegram/main/scripts/bootstrap.sh | sudo bash',
          )
          text = text.replace(
              '\nUntil then the bootstrap intentionally refuses the placeholder repository name.\n',
              '\n',
          )
          readme.write_text(text)
          PY
          bash -n /tmp/source/scripts/bootstrap.sh

      - name: Validate finalized source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/source
          python3 -m pip install -q -r requirements.txt
          python3 -m compileall -q app.py scripts tests
          python3 -m unittest discover -s tests
          for file in scripts/*.sh tests/*.sh; do bash -n "$file"; done
          ./scripts/release.sh --dry-run

      - name: Publish project except permanent workflows
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a /tmp/source/. .
          rm -f .github/workflows/ci.yml
          rm -f .github/workflows/image.yml
          rm -f .github/workflows/release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Publish 0.5.3-hw'
          git push origin HEAD:main
