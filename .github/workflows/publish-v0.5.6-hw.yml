name: Publish v0.5.6-hw tag

on:
  push:
    branches:
      - publish/v0.5.6-hw
    paths:
      - .github/workflows/publish-v0.5.6-hw.yml

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publish branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: publish/v0.5.6-hw
          fetch-depth: 0

      - name: Create exact release tag and clean helper workflow
        shell: bash
        env:
          TARGET_SHA: 5b8674c0eb100e07aed6140b0fa9be92f9758bba
          RELEASE_TAG: v0.5.6-hw
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]] || {
            echo "ERROR: main moved away from expected release SHA" >&2
            exit 2
          }
          version="$(git show "$TARGET_SHA:VERSION" | tr -d '\r\n')"
          release_version="$(git show "$TARGET_SHA:RELEASE_VERSION" | tr -d '\r\n')"
          live_version="$(git show "$TARGET_SHA:LIVE_VERSION" | tr -d '\r\n')"
          [[ "$version" == "0.5.6-hw" ]] || exit 3
          [[ "$release_version" == "$version" ]] || exit 4
          [[ "$live_version" == "$version" ]] || exit 5
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "ERROR: tag already exists" >&2
            exit 6
          fi
          git tag "$RELEASE_TAG" "$TARGET_SHA"
          git push origin "$RELEASE_TAG"
          rm -f .github/workflows/publish-v0.5.6-hw.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove v0.5.6-hw publish helper"
          git push origin HEAD:publish/v0.5.6-hw
