name: One-time README cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-time multilingual README cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Remove development-rules sections
        shell: python
        run: |
          from pathlib import Path
          import re

          sections = {
              'README_EN.md': r'\n## Development quality rules\n.*?(?=\n## Roadmap\n)',
              'README_RU.md': r'\n## Правила разработки\n.*?(?=\n## Roadmap\n)',
              'README_UA.md': r'\n## Правила розробки\n.*?(?=\n## Roadmap\n)',
          }
          for name, pattern in sections.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{name}: expected one section, got {count}')
              path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/readme-cleanup-once.yml').unlink()
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README_EN.md README_RU.md README_UA.md .github/workflows/readme-cleanup-once.yml
          git commit -m 'Remove development rules from multilingual README'
          git push origin HEAD:main
