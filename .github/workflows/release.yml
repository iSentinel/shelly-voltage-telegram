name: Source Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      test_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "$tag" == v* ]] || {
            echo "ERROR: release tag must start with v" >&2
            exit 2
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Validate tag matches VERSION and CI-tested commit
        shell: bash
        env:
          TESTED_SHA: ${{ needs.ci.outputs.tested_commit }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$TESTED_SHA" ]] || {
            echo "ERROR: source release differs from CI-tested commit" >&2
            exit 5
          }
          tag='${{ steps.tag.outputs.tag }}'
          [[ "$GITHUB_REF" == "refs/tags/$tag" ]] || {
            echo "ERROR: source signing requires the exact tag event ref" >&2
            exit 6
          }
          version="$(tr -d '\r\n' < VERSION)"
          release_version="$(tr -d '\r\n' < RELEASE_VERSION)"
          [[ "$tag" == "v$version" ]] || {
            echo "ERROR: tag $tag does not match VERSION=$version" >&2
            exit 3
          }
          [[ "$release_version" == "$version" ]] || {
            echo "ERROR: RELEASE_VERSION=$release_version must match VERSION=$version" >&2
            exit 4
          }

      - name: Build reproducible source assets
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          ./scripts/release.sh \
            --output-dir dist \
            --source-date-epoch "$epoch"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Verify public release contents
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="dist/shelly-voltage-telegram-${version}.tar.gz"
          tar -tzf "$archive" > /tmp/release-list.txt
          forbidden="$(grep -E '(^|/)\.env$|(^|/)secrets/|(^|/)__pycache__/|(^|/)validation/|(^|/)dist-publish/|(^|/)ROADMAP\.md\.pre-|\.py[co]$|\.sqlite(3)?([.-]|$)|\.log$' /tmp/release-list.txt || true)"
          [[ -z "$forbidden" ]] || {
            printf 'ERROR: private/generated release entries:\n%s\n' "$forbidden" >&2
            exit 4
          }

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable source bundle
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="dist/shelly-voltage-telegram-$version.tar.gz"
          bundle="$archive.sigstore.json"
          [[ "$GITHUB_REF" == "refs/tags/$SOURCE_TAG" ]] || exit 6
          [[ -s "$archive" ]] || exit 7
          cosign version | grep -Eq '^GitVersion:[[:space:]]+v3\.'
          cosign sign-blob --yes --bundle "$bundle" "$archive"
          [[ -s "$bundle" ]] || exit 8
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$SOURCE_TAG"
          cosign verify-blob --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          echo "SIGNED SOURCE ARCHIVE BUNDLE: PASS"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release $RELEASE_TAG already exists" >&2
            exit 5
          fi
          version="$(tr -d '\r\n' < VERSION)"
          archive="dist/shelly-voltage-telegram-$version.tar.gz"
          gh release create "$RELEASE_TAG" \
            "$archive" "$archive.sigstore.json" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
