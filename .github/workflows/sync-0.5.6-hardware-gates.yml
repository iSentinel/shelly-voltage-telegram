name: Sync 0.5.6 hardware gates

on:
  push:
    branches:
      - docs/0.5.6-hardware-gates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/0.5.6-hardware-gates
          fetch-depth: 0

      - name: Update current hardware gates
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/update.py
          python /tmp/update.py
          python scripts/check-quality.py
          python -m unittest tests.test_metadata -v

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md RELEASE_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'Clarify 0.5.6 hardware promotion gates'
          git push origin HEAD:docs/0.5.6-hardware-gates
