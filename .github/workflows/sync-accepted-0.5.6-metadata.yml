name: Sync accepted 0.5.6-hw metadata

on:
  push:
    branches:
      - release/0.5.6-hw-source-sync
    paths:
      - .github/0.5.6-metadata.patch
      - .github/workflows/sync-accepted-0.5.6-metadata.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Verify accepted metadata patch
        run: |
          echo "b09652559d31e3a2c4c844870e6cdf213eda36fa4af0b2d2ad4b1b93592dabb0  .github/0.5.6-metadata.patch" | sha256sum -c -
          git apply --check .github/0.5.6-metadata.patch
      - name: Apply accepted metadata and remove temporary files
        run: |
          git apply .github/0.5.6-metadata.patch
          rm .github/0.5.6-metadata.patch
          rm .github/workflows/sync-accepted-0.5.6-metadata.yml
          git diff --check
      - name: Commit accepted metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync accepted 0.5.6-hw metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
