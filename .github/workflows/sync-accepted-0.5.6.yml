name: Sync accepted 0.5.6-hw tree

on:
  push:
    branches:
      - release/0.5.6-hw-source-sync
    paths:
      - .github/0.5.6-remaining.patch
      - .github/workflows/sync-accepted-0.5.6.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Verify accepted patch
        run: |
          echo "e04298f1b8bc7208a73ec81b901d3a563420da5a5b125d9a51471dddd031c77e  .github/0.5.6-remaining.patch" | sha256sum -c -
          git apply --check .github/0.5.6-remaining.patch
      - name: Apply accepted tree and remove temporary files
        run: |
          git apply .github/0.5.6-remaining.patch
          rm .github/0.5.6-remaining.patch
          rm .github/workflows/sync-accepted-0.5.6.yml
          git diff --check
      - name: Commit accepted source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync accepted 0.5.6-hw source tree"
          git push origin "HEAD:${GITHUB_REF_NAME}"
