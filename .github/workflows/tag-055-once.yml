name: Create 0.5.5 release tag

on:
  push:
    paths:
      - .github/workflows/tag-055-once.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create exact v0.5.5-hw tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/git/refs"
          body='{"ref":"refs/tags/v0.5.5-hw","sha":"f669dbb628854ea6bdbedd61d3b505fe613c93bf"}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            -d "${body}"
