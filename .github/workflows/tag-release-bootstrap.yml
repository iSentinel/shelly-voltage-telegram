name: Tag 0.5.3-hw release

on:
  push:
    paths:
      - .github/workflows/tag-release-bootstrap.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Remove bootstrap and create release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.5.3-hw"
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.3-hw >/dev/null; then
            echo "ERROR: v0.5.3-hw already exists" >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tag-release-bootstrap.yml
          git commit -m 'Remove temporary release bootstrap'
          git push origin HEAD:main
          git tag -a v0.5.3-hw -m 'v0.5.3-hw'
          git push origin v0.5.3-hw
