name: Temporary candidate format

on:
  push:
    branches:
      - fix/telegram-full-localization-20261105

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/telegram-full-localization-20261105
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Format only candidate files
        run: |
          python -m pip install ruff==0.14.2
          ruff format app.py telegram_i18n.py tests/test_telegram_localization.py
          git diff --check
          if ! git diff --quiet -- app.py telegram_i18n.py tests/test_telegram_localization.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app.py telegram_i18n.py tests/test_telegram_localization.py
            git commit -m 'style: apply pinned Ruff to localized Telegram candidate'
            git push origin HEAD:refs/heads/fix/telegram-full-localization-20261105
          fi
