name: Update promotion acceptance count

on:
  push:
    branches:
      - feature/0.5.6-promotion-check
    paths:
      - .github/workflows/update-promotion-count.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/0.5.6-promotion-check
      - name: Update accepted test count
        shell: bash
        run: |
          set -euo pipefail
          sed -i -e 's/121\/121/122\/122/g' -e 's/116\/116/122\/122/g' \
            ROADMAP.md RELEASE_STATUS.md CHANGELOG.md
          git diff --check
      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md RELEASE_STATUS.md CHANGELOG.md
          git commit -m 'Update 0.5.6 acceptance count to 122 tests'
          git push origin HEAD:feature/0.5.6-promotion-check
