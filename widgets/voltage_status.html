<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;padding:0;color:var(--tg-theme-text-color,#eef3fa);font:14px system-ui,sans-serif}
.card{padding:15px 14px 20px;background:var(--tg-theme-secondary-bg-color,#172335);border-radius:16px}
.header,.line,.legend,.axis{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header{font-size:13px;font-weight:700}
.icon{font-size:19px;color:#36b574}
.status{padding:5px 8px;border:1px solid #97a0ac;border-radius:20px;font-size:10px;letter-spacing:.5px}
.status.online{border-color:#20a765;color:#20a765}
.status.offline{border-color:#eb655a;color:#eb655a}
.status.stale{border-color:#e5a335;color:#e5a335}
.hero{text-align:center;padding:20px 0 15px}
.label,.sub,.hint{color:var(--tg-theme-hint-color,#aeb8c5);font-size:12px}
.value{font-size:43px;line-height:1.3;font-weight:750;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.unit{font-size:24px;font-weight:500;letter-spacing:0}
.metrics{display:flex;gap:8px}
.tile{flex:1;min-width:0;border:1px solid var(--tg-theme-hint-color,#7c899a);border-radius:12px;padding:8px}
.tile strong{display:block;font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.section{margin-top:16px;border-top:1px solid var(--tg-theme-hint-color,#7c899a);padding-top:12px}
.section .label{font-weight:650}
.timeline{display:flex;gap:1px;height:13px;margin:11px 0 6px}
.timeline i{flex:1;border-radius:2px;background:#a2aab5}
.timeline .on{background:#24a967}
.timeline .off{background:#e35b4f}
.timeline .maybe{background:#d8a133}
.axis{font-size:10px;color:var(--tg-theme-hint-color,#aeb8c5)}
.legend{font-size:10px;color:var(--tg-theme-hint-color,#aeb8c5);margin-top:11px}
.key{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
.onkey{background:#24a967}.offkey{background:#e35b4f}.maybekey{background:#d8a133}
.footer{font-size:10px;color:var(--tg-theme-hint-color,#aeb8c5);margin-top:12px;line-height:1.35}
</style>
</head>
<body>
<div class="card">
  <div class="header"><span><span class="icon">⚡</span> Электросеть · Shelly</span><span id="state" class="status">НЕТ ДАННЫХ</span></div>
  <div class="hero"><div class="label">Напряжение · L1</div><div class="value"><span id="voltage">—</span> <span class="unit">В</span></div><div id="notice" class="sub">Ожидание свежих измерений</div></div>
  <div class="metrics"><div class="tile"><span class="hint">Частота</span><strong id="frequency">—</strong></div><div class="tile"><span class="hint">Последний опрос</span><strong id="age">—</strong></div></div>
  <div class="section"><div class="line"><span class="label">Прогноз отключений</span><span id="group" class="hint">—</span></div><div id="timeline" class="timeline"></div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div><div class="legend"><span><i class="key onkey"></i>По плану свет есть</span><span><i class="key offkey"></i>Нет</span><span><i class="key maybekey"></i>Возможно</span></div></div>
  <div class="footer"><span id="source">График не загружен</span><div>План не подтверждает наличие электричества. Факт — только свежие данные Shelly.</div></div>
</div>
<script>
(function(){
  const w=window.TelegramWidget;
  const $=id=>document.getElementById(id);
  function render(){
    let data=null;
    try{data=JSON.parse(w&&typeof w.publicData==="string"?w.publicData:"null")}catch(e){}
    const fresh=data&&data.schema===1&&data.s==="online"&&
      typeof data.t==="number"&&Date.now()/1000-data.t>=0&&Date.now()/1000-data.t<=60&&
      typeof data.v==="number"&&Number.isFinite(data.v)&&data.v>=0&&data.v<=400;
    const state=fresh?"online":data&&data.s==="offline"?"offline":
      data&&data.s==="stale"?"stale":"unknown";
    $("state").className="status "+state;
    $("state").textContent=state==="online"?"ОНЛАЙН":state==="offline"?"НЕТ СВЯЗИ":
      state==="stale"?"НЕТ СВЕЖИХ ДАННЫХ":"НЕТ ДАННЫХ";
    $("voltage").textContent=fresh?data.v.toFixed(1):"—";
    $("frequency").textContent=fresh&&typeof data.f==="number"&&Number.isFinite(data.f)&&data.f>=40&&data.f<=70?data.f.toFixed(1)+" Гц":"—";
    $("age").textContent=fresh?Math.round(Date.now()/1000-data.t)+" сек":"—";
    $("notice").textContent=fresh?"Реальное измерение":"Неизвестно, есть ли электричество";
    $("group").textContent=data&&typeof data.g==="string"?"Группа "+data.g:"—";
    const chart=$("timeline");
    chart.textContent="";
    const bars=data&&typeof data.b==="string"&&/^[OX?]{48}$/.test(data.b)?data.b:"";
    for(const symbol of bars){
      const cell=document.createElement("i");
      cell.className=symbol==="O"?"on":symbol==="X"?"off":"maybe";
      chart.appendChild(cell);
    }
    $("source").textContent=bars&&data.src==="community"?
      "Неофициальный прогноз · outage-data-ua":"График не загружен";
  }
  if(w&&typeof w.onEvent==="function"){
    w.onEvent("publicDataChanged",render);
    w.onEvent("activated",render);
    if(typeof w.watchPublicData==="function")w.watchPublicData();
  }
  render();
  setInterval(render,10000);
})();
</script>
</body>
</html>
