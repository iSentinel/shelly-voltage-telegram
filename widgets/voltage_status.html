<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;padding:0;color:var(--tg-theme-text-color,#eef3fa);font:14px system-ui,sans-serif}
.card{padding:15px 14px 20px;background:var(--tg-theme-secondary-bg-color,#172335);border-radius:16px}
.header,.line,.legend,.axis{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header{font-size:13px;font-weight:700}
.icon{font-size:19px;color:#36b574}
.status{padding:5px 8px;border:1px solid #97a0ac;border-radius:20px;font-size:10px;letter-spacing:.5px}
.status.online{border-color:#20a765;color:#20a765}
.status.offline{border-color:#eb655a;color:#eb655a}
.status.stale{border-color:#e5a335;color:#e5a335}
.hero{text-align:center;padding:20px 0 15px}
.label,.sub,.hint{color:var(--tg-theme-hint-color,#aeb8c5);font-size:12px}
.value{font-size:43px;line-height:1.3;font-weight:750;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.unit{font-size:24px;font-weight:500;letter-spacing:0}
.metrics{display:flex;gap:8px}.metrics[hidden]{display:none}.secondary{margin-top:8px}
.tile{flex:1;min-width:0;border:1px solid var(--tg-theme-hint-color,#7c899a);border-radius:12px;padding:8px}
.tile strong{display:block;font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.section{margin-top:16px;border-top:1px solid var(--tg-theme-hint-color,#7c899a);padding-top:12px}
.section .label{font-weight:650}
.timeline{display:flex;gap:1px;height:13px;margin:11px 0 6px}
.timeline i{flex:1;border-radius:2px;background:#a2aab5}
.timeline .on{background:#24a967}
.timeline .off{background:#e35b4f}
.timeline .maybe{background:#d8a133}
.axis{font-size:10px;color:var(--tg-theme-hint-color,#aeb8c5)}
.legend{font-size:10px;color:var(--tg-theme-hint-color,#aeb8c5);margin-top:11px}
.key{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
.onkey{background:#24a967}.offkey{background:#e35b4f}.maybekey{background:#d8a133}
.footer{font-size:10px;color:var(--tg-theme-hint-color,#aeb8c5);margin-top:12px;line-height:1.35}
@media(max-width:300px){.value{font-size:38px}.legend{flex-wrap:wrap;justify-content:flex-start}}
</style>
</head>
<body>
<div class="card">
 <div class="header"><span><span class="icon">⚡</span> <span id="brand">Електромережа · Shelly</span></span><span id="state" class="status">НЕМАЄ ДАНИХ</span></div>
 <div class="hero"><div class="label"><span id="voltageLabel">Напруга</span> · L1</div><div class="value"><span id="voltage">—</span> <span id="unit" class="unit">В</span></div><div id="notice" class="sub">Очікування свіжого вимірювання</div></div>
 <div class="metrics"><div class="tile"><span class="hint" id="frequencyLabel">Частота</span><strong id="frequency">—</strong></div><div class="tile"><span id="ageLabel" class="hint">Останній запит</span><strong id="age">—</strong></div></div>
 <div id="extraPhases" class="metrics secondary" hidden><div class="tile"><span class="hint">L2</span><strong id="phaseL2">—</strong></div><div class="tile"><span class="hint">L3</span><strong id="phaseL3">—</strong></div></div>
 <div class="section"><div class="line"><span id="forecastLabel" class="label">Прогноз відключень</span><span id="group" class="hint">—</span></div><div id="timeline" class="timeline"></div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div><div class="legend"><span><i class="key onkey"></i><span id="hasLight">Світло за планом</span></span><span><i class="key offkey"></i><span id="noLight">Відключення</span></span><span><i class="key maybekey"></i><span id="maybeLight">Можливо</span></span></div></div>
 <div class="footer"><span id="source">Графік недоступний</span><div id="disclaimer">Прогноз не підтверджує наявність електрики. Факт — лише свіжі дані Shelly.</div></div>
</div>
<script>
(function(){
  const w=window.TelegramWidget;
  const $=id=>document.getElementById(id);
  const words={
    uk:["Електромережа · Shelly","НА ЗВ'ЯЗКУ","НЕМАЄ ЗВ'ЯЗКУ","ЗАСТАРІЛО","НЕМАЄ ДАНИХ","Напруга","Частота","Останній запит","Вимір Shelly","Стан живлення невідомий","Прогноз відключень","Група ","Світло за планом","Відключення","Можливо","Графік недоступний","Неофіційний прогноз · outage-data-ua","Графік застарів","Прогноз не підтверджує наявність електрики. Факт — лише свіжі дані Shelly.","с","В","Гц"],
    ru:["Электросеть · Shelly","НА СВЯЗИ","НЕТ СВЯЗИ","УСТАРЕЛО","НЕТ ДАННЫХ","Напряжение","Частота","Последний опрос","Измерено Shelly","Неизвестно, есть ли электричество","Прогноз отключений","Группа ","По плану свет есть","Отключение","Возможно","График не загружен","Неофициальный прогноз · outage-data-ua","График устарел","План не подтверждает наличие электричества. Факт — только свежие данные Shelly.","с","В","Гц"],
    en:["Power monitor · Shelly","CONNECTED","DISCONNECTED","STALE","NO DATA","Voltage","Frequency","Last sample","Shelly measurement","Actual mains status unknown","Outage forecast","Group ","Scheduled power","Outage","Possible","Schedule unavailable","Unofficial forecast · outage-data-ua","Schedule expired","A forecast is not proof of power. Only fresh Shelly readings are measured.","s","V","Hz"]
  };
  let drawn=null;
  function validBars(data,now){
    if(!data||data.schema!==1||data.src!=="community"||typeof data.b!=="string"||
       !/^[OX?]{48}$/.test(data.b))return "";
    if(typeof data.u!=="number"||!Number.isFinite(data.u)||
       typeof data.e!=="number"||!Number.isFinite(data.e))return "";
    if(now<data.u||now-data.u>7200||now>=data.e)return "";
    return data.b;
  }
  function drawBars(bars){
    if(bars===drawn)return;
    const chart=$("timeline");
    chart.textContent="";
    for(const symbol of bars){
      const cell=document.createElement("i");
      cell.className=symbol==="O"?"on":symbol==="X"?"off":"maybe";
      chart.appendChild(cell);
    }
    drawn=bars;
  }
  function render(){
    let data=null;
    try{data=JSON.parse(w&&typeof w.publicData==="string"?w.publicData:"null")}catch(e){}
    const lang=data&&typeof data.l==="string"&&words[data.l]?data.l:"uk";
    const T=words[lang];
    const now=Date.now()/1000;
    const fresh=data&&data.schema===1&&data.s==="online"&&
      typeof data.t==="number"&&now-data.t>=0&&now-data.t<=60&&
      typeof data.v==="number"&&Number.isFinite(data.v)&&data.v>=0&&data.v<=400;
    const state=fresh?"online":data&&data.s==="offline"?"offline":
      data&&(data.s==="stale"||data.s==="online")?"stale":"unknown";
    $("brand").textContent=T[0];
    $("state").className="status "+state;
    $("state").textContent=state==="online"?T[1]:state==="offline"?T[2]:
      state==="stale"?T[3]:T[4];
    $("voltageLabel").textContent=T[5]; $("frequencyLabel").textContent=T[6];
    $("ageLabel").textContent=T[7]; $("forecastLabel").textContent=T[10];
    $("voltage").textContent=fresh?data.v.toFixed(1):"—";
    $("unit").textContent=T[20];
    $("frequency").textContent=fresh&&typeof data.f==="number"&&
      Number.isFinite(data.f)&&data.f>=40&&data.f<=70?
      data.f.toFixed(1)+" "+T[21]:"—";
    $("age").textContent=fresh?Math.floor(now-data.t)+" "+T[19]:"—";
    $("notice").textContent=fresh?T[8]:T[9];
    const multi=data&&data.schema===1&&data.p&&
      typeof data.p==="object"&&data.p.L2&&data.p.L3;
    $("extraPhases").hidden=!multi;
    if(multi){
      for(const phase of ["L2","L3"]){
        const item=data.p[phase];
        const valid=item&&item.s==="online"&&typeof item.t==="number"&&
          now-item.t>=0&&now-item.t<=60&&
          typeof item.v==="number"&&Number.isFinite(item.v)&&
          item.v>=0&&item.v<=400;
        $("phase"+phase).textContent=valid?item.v.toFixed(1)+" "+T[20]:"—";
      }
    }
    $("group").textContent=data&&typeof data.g==="string"?T[11]+data.g:"—";
    $("hasLight").textContent=T[12];$("noLight").textContent=T[13];
    $("maybeLight").textContent=T[14];$("disclaimer").textContent=T[18];
    const bars=validBars(data,now);
    drawBars(bars);
    $("source").textContent=bars?T[16]:data&&data.b?T[17]:T[15];
  }
  if(w&&typeof w.onEvent==="function"){
    w.onEvent("publicDataChanged",render);
    w.onEvent("activated",render);
    if(typeof w.watchPublicData==="function")w.watchPublicData();
  }
  render();
  if(w&&typeof w.ready==="function")w.ready();
  setInterval(render,10000);
})();
</script>
</body>
</html>
